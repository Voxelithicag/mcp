name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # cache: npm намеренно не включён: без package-lock.json шаг падает.
      - run: npm install --no-audit --no-fund
      # Тест поднимает сервер и говорит с ним по JSON-RPC против живого API,
      # поэтому падение сети красит сборку. Пусть лучше сообщит, чем промолчит.
      - name: Handshake and tools against the live API
        run: npm test
